<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-25px) scale(1.15)}}@keyframes floatSlow2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.1)}}@keyframes pulseBeam{0%{stroke-dashoffset:400;opacity:.2}50%{stroke-dashoffset:0;opacity:.8}}@keyframes cardFloat1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes cardFloat2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.title{font-size:42px;font-weight:800;letter-spacing:-.5px}.subtitle,.tag,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.subtitle{font-size:19px;font-weight:400;fill:#94a3b8}.tag{font-size:13px;font-weight:600}.orb1{animation:floatSlow1 12s ease-in-out infinite}.orb2{animation:floatSlow2 15s ease-in-out infinite}.pulse-flow{stroke-dasharray:60 120;animation:pulseBeam 8s linear infinite}.floating-card-1{animation:cardFloat1 6s ease-in-out infinite}.floating-card-2{animation:cardFloat2 7s ease-in-out infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><g opacity=".35"><circle cx="200" cy="90" r="140" fill="#38bdf8" class="orb1" filter="blur(60px)"/><circle cx="1020" cy="270" r="160" fill="#a855f7" class="orb2" filter="blur(70px)"/><circle cx="620" cy="310" r="110" fill="#6366f1" class="orb1" filter="blur(65px)"/></g><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g fill="none" stroke-width="2"><path stroke="#334155" stroke-opacity=".4" d="M 80 300 C 300 300, 360 220, 520 220 C 680 220, 750 280, 950 280 L 1120 280"/><path stroke="url(#accentGradient)" d="M 80 300 C 300 300, 360 220, 520 220 C 680 220, 750 280, 950 280 L 1120 280" class="pulse-flow"/></g><g class="floating-card-1" transform="translate(850, 45)"><rect width="270" height="70" fill="url(#cardGrad)" stroke="#475569" stroke-opacity=".5" stroke-width="1" backdrop-filter="blur(8px)" rx="12"/><circle cx="35" cy="35" r="14" fill="#38bdf8" fill-opacity=".2"/><text x="35" y="40" fill="#38bdf8" font-size="14" text-anchor="middle">⚛</text><text x="65" y="32" fill="#f8fafc" class="tag">Isolated Workshop</text><text x="65" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Storybook • Ladle • Histoire</text></g><g class="floating-card-2" transform="translate(880, 135)"><rect width="250" height="70" fill="url(#cardGrad)" stroke="#475569" stroke-opacity=".5" stroke-width="1" rx="12"/><circle cx="35" cy="35" r="14" fill="#818cf8" fill-opacity=".2"/><text x="35" y="40" fill="#818cf8" font-size="14" text-anchor="middle">📸</text><text x="65" y="32" fill="#f8fafc" class="tag">Visual Regression</text><text x="65" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Playwright • Chromatic • Loki</text></g><g transform="translate(80, 55)"><rect width="340" height="30" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="32" y="20" fill="#38bdf8" class="tag">CURATED ECOSYSTEM &amp; TESTING DIRECTORY</text></g><text x="80" y="140" fill="#fff" class="title">Awesome Component</text><text x="80" y="185" fill="url(#accentGradient)" class="title">Development &amp; Testing</text><text x="80" y="230" class="subtitle">The ultimate curated ecosystem of UI component workshops, visual regression suites,</text><text x="80" y="256" class="subtitle">accessible design systems, API mocking frameworks, and design-to-code handoffs.</text><g transform="translate(80, 290)"><rect width="130" height="28" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="65" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎨 Design Systems</text></g><g transform="translate(220, 290)"><rect width="135" height="28" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="67" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔬 UI Component CT</text></g><g transform="translate(365, 290)"><rect width="145" height="28" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="72" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📸 Visual Regression</text></g><g transform="translate(520, 290)"><rect width="125" height="28" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="62" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Fast Handoff</text></g></svg>