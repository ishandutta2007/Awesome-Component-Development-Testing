<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 19px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }

      /* Animated Glowing Orbs in background */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(50px, -25px) scale(1.15); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-40px, 30px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { stroke-dashoffset: 0; opacity: 0.8; }
        100% { stroke-dashoffset: -400; opacity: 0.2; }
      }
      @keyframes cardFloat1 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes cardFloat2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
        100% { transform: translateY(0px); }
      }

      .orb1 { animation: floatSlow1 12s ease-in-out infinite; }
      .orb2 { animation: floatSlow2 15s ease-in-out infinite; }
      .pulse-flow {
        stroke-dasharray: 60 120;
        animation: pulseBeam 8s linear infinite;
      }
      .floating-card-1 { animation: cardFloat1 6s ease-in-out infinite; }
      .floating-card-2 { animation: cardFloat2 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Orbs (Background layer) -->
  <g opacity="0.35">
    <circle class="orb1" cx="200" cy="90" r="140" fill="#38bdf8" filter="blur(60px)" />
    <circle class="orb2" cx="1020" cy="270" r="160" fill="#a855f7" filter="blur(70px)" />
    <circle class="orb1" cx="620" cy="310" r="110" fill="#6366f1" filter="blur(65px)" />
  </g>

  <!-- Grid overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Connecting Data Flow / Circuit line in background -->
  <g fill="none" stroke-width="2">
    <!-- Static baseline path -->
    <path d="M 80 300 C 300 300, 360 220, 520 220 C 680 220, 750 280, 950 280 L 1120 280" stroke="#334155" stroke-opacity="0.4" />
    <!-- Animated pulse stream -->
    <path class="pulse-flow" d="M 80 300 C 300 300, 360 220, 520 220 C 680 220, 750 280, 950 280 L 1120 280" stroke="url(#accentGradient)" />
  </g>

  <!-- Dynamic Decorative Badge/Cards in right background -->
  <g transform="translate(850, 45)" class="floating-card-1">
    <rect width="270" height="70" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" stroke-opacity="0.5" backdrop-filter="blur(8px)" />
    <circle cx="35" cy="35" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <text x="35" y="40" text-anchor="middle" font-size="14" fill="#38bdf8">⚛</text>
    <text x="65" y="32" class="tag" fill="#f8fafc">Isolated Workshop</text>
    <text x="65" y="50" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Storybook • Ladle • Histoire</text>
  </g>

  <g transform="translate(880, 135)" class="floating-card-2">
    <rect width="250" height="70" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="35" cy="35" r="14" fill="#818cf8" fill-opacity="0.2" />
    <text x="35" y="40" text-anchor="middle" font-size="14" fill="#818cf8">📸</text>
    <text x="65" y="32" class="tag" fill="#f8fafc">Visual Regression</text>
    <text x="65" y="50" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Playwright • Chromatic • Loki</text>
  </g>

  <!-- Foreground Content: Header & Main Typography -->
  <!-- Top Capsule Pill -->
  <g transform="translate(80, 55)">
    <rect width="340" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" class="tag" fill="#38bdf8">CURATED ECOSYSTEM &amp; TESTING DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="140" class="title" fill="#ffffff">
    Awesome Component
  </text>
  <text x="80" y="185" class="title" fill="url(#accentGradient)">
    Development &amp; Testing
  </text>

  <!-- Subtitle -->
  <text x="80" y="230" class="subtitle">
    The ultimate curated ecosystem of UI component workshops, visual regression suites,
  </text>
  <text x="80" y="256" class="subtitle">
    accessible design systems, API mocking frameworks, and design-to-code handoffs.
  </text>

  <!-- Bottom Feature Badges / Highlights -->
  <g transform="translate(80, 290)">
    <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🎨 Design Systems</text>
  </g>
  <g transform="translate(220, 290)">
    <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="67" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔬 UI Component CT</text>
  </g>
  <g transform="translate(365, 290)">
    <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="72" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📸 Visual Regression</text>
  </g>
  <g transform="translate(520, 290)">
    <rect width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="62" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Fast Handoff</text>
  </g>
</svg>
